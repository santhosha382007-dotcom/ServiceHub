<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments :: head}"><title>Book a service | ServiceHub</title></head>
<body><header th:replace="~{fragments :: site-header}"></header><main><section class="page-hero"><div class="container"><p class="eyebrow">Make it official</p><h1 class="page-title">Book a service.</h1><p class="page-lead">Tell us a little about what you need, and we will take it from there.</p></div></section><section class="form-shell"><form data-demo-form><div class="form-grid"><div class="form-group full"><label for="service">Choose a service</label><select id="service" required><option value="">Select a service</option><option>Home cleaning</option><option>AC service</option><option>Plumbing help</option><option>Design support</option></select></div><div class="form-group"><label for="customerName">Customer name</label><input id="customerName" type="text" placeholder="Your full name" required></div><div class="form-group"><label for="bookingPhone">Phone number</label><input id="bookingPhone" type="tel" placeholder="+91 98765 43210" required></div><div class="form-group"><label for="date">Preferred date</label><input id="date" type="date" required></div><div class="form-group"><label for="time">Preferred time</label><select id="time" required><option value="">Select a time</option><option>9:00 AM - 11:00 AM</option><option>12:00 PM - 2:00 PM</option><option>4:00 PM - 6:00 PM</option></select></div><div class="form-group full"><label for="description">Anything else we should know?</label><textarea id="description" placeholder="Share any details that will help the professional prepare."></textarea></div></div><button class="button button-coral form-submit" type="submit">Confirm booking</button><p class="form-note" data-form-notice hidden></p></form></section></main><footer th:replace="~{fragments :: site-footer}"></footer><script th:src="@{/js/app.js}"></script></body></html>
