<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments :: head}"><title>Sign in | ServiceHub</title></head>
<body><header th:replace="~{fragments :: site-header}"></header><main><section class="form-shell"><div class="form-heading"><p class="eyebrow">Welcome back</p><h1>Sign in to ServiceHub</h1><p>Keep your bookings and favourite services close.</p></div><form data-demo-form><div class="form-group"><label for="email">Email address</label><input id="email" type="email" placeholder="you@example.com" required></div><div class="form-group" style="margin-top:17px"><label for="password">Password</label><input id="password" type="password" placeholder="Enter your password" required></div><button class="button form-submit" type="submit">Sign in</button><p class="form-note" data-form-notice hidden></p></form><p class="form-footer">New to ServiceHub? <a th:href="@{/register}">Create an account</a></p></section></main><footer th:replace="~{fragments :: site-footer}"></footer><script th:src="@{/js/app.js}"></script></body></html>
