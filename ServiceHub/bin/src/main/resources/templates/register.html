<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments :: head}"><title>Create account | ServiceHub</title></head>
<body><header th:replace="~{fragments :: site-header}"></header><main><section class="form-shell"><div class="form-heading"><p class="eyebrow">Start simply</p><h1>Create your account</h1><p>Save your details and make your next booking faster.</p></div><form data-demo-form><div class="form-grid"><div class="form-group full"><label for="fullName">Full name</label><input id="fullName" type="text" placeholder="Your full name" required></div><div class="form-group"><label for="registerEmail">Email address</label><input id="registerEmail" type="email" placeholder="you@example.com" required></div><div class="form-group"><label for="phone">Phone number</label><input id="phone" type="tel" placeholder="+91 98765 43210" required></div><div class="form-group"><label for="registerPassword">Password</label><input id="registerPassword" type="password" placeholder="Create a password" required></div><div class="form-group"><label for="confirmPassword">Confirm password</label><input id="confirmPassword" type="password" placeholder="Repeat your password" required></div></div><button class="button form-submit" type="submit">Create account</button><p class="form-note" data-form-notice hidden></p></form><p class="form-footer">Already have an account? <a th:href="@{/login}">Sign in</a></p></section></main><footer th:replace="~{fragments :: site-footer}"></footer><script th:src="@{/js/app.js}"></script></body></html>
