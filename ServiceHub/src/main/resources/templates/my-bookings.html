<!DOCTYPE html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments :: head}"><title>My bookings | ServiceHub</title></head><body><header th:replace="~{fragments :: site-header}"></header><main><section class="page-hero"><div class="container"><p class="eyebrow">Your ServiceHub timeline</p><h1 class="page-title">My bookings.</h1></div></section><section class="page-section"><div class="container"><p class="form-success" th:if="${successMessage}" th:text="${successMessage}"></p><p class="form-alert" th:if="${errorMessage}" th:text="${errorMessage}"></p><div class="dashboard-heading"><h2>Upcoming & recent</h2><a class="button button-small" th:href="@{/services}">Book another service</a></div><div class="table-shell"><table class="booking-table"><thead><tr><th>Booking ID</th><th>Service</th><th>Date</th><th>Time</th><th>Status</th><th>Action</th></tr></thead><tbody><tr th:if="${#lists.isEmpty(bookings)}"><td colspan="6" style="text-align:center; padding: 28px; color: #777;">You have not made any bookings yet. <a th:href="@{/services}" style="color:var(--teal); font-weight:600;">Book a service now</a>.</td></tr><tr th:each="b : ${bookings}"><td class="booking-id" th:text="${b.bookingCode}">#SH-1048</td><td th:text="${b.serviceName}">Home cleaning</td><td th:text="${b.bookingDate}">18 Apr 2025</td><td th:text="${b.bookingTime}">10:00 AM</td><td><span th:if="${b.status.name() == 'CONFIRMED'}" class="status">Confirmed</span><span th:if="${b.status.name() == 'PENDING'}" class="status pending">Pending Approval</span><span th:if="${b.status.name() == 'REJECTED'}" class="status rejected">Rejected</span><span th:if="${b.status.name() == 'CANCELLED'}" class="status cancelled">Cancelled</span></td><td><form th:if="${b.status.name() == 'PENDING' || b.status.name() == 'CONFIRMED'}" th:action="@{'/bookings/' + ${b.id} + '/cancel'}" method="post" style="display:inline;" onsubmit="return confirm('Are you sure you want to cancel this booking?');"><button class="cancel-button" type="submit">Cancel</button></form><span th:unless="${b.status.name() == 'PENDING' || b.status.name() == 'CONFIRMED'}">-</span></td></tr></tbody></table></div></div></section></main><footer th:replace="~{fragments :: site-footer}"></footer><script th:src="@{/js/app.js}"></script></body></html>
