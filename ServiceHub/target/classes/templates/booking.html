<!DOCTYPE html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments :: head}"><title>Book a service | ServiceHub</title></head><body><header th:replace="~{fragments :: site-header}"></header><main><section class="page-hero"><div class="container"><p class="eyebrow">Make it official</p><h1 class="page-title">Book a service.</h1></div></section><section class="form-shell"><p class="form-alert" th:if="${errorMessage}" th:text="${errorMessage}"></p><form th:action="@{/booking}" method="post"><div class="form-grid"><div class="form-group full"><label>Choose a service</label><select name="service" required><option value="">Select a service</option><option value="Home cleaning" th:selected="${selectedService == 'Home cleaning'}">Home cleaning</option><option value="AC service" th:selected="${selectedService == 'AC service'}">AC service</option><option value="Plumbing help" th:selected="${selectedService == 'Plumbing help'}">Plumbing help</option></select></div><div class="form-group"><label>Customer name</label><input type="text" name="customerName" th:value="${session.userName}" required></div><div class="form-group"><label>Phone number</label><input type="tel" name="phone" required></div><div class="form-group"><label>Preferred date</label><input type="date" name="date" required></div><div class="form-group"><label>Preferred time</label><input type="text" name="time" placeholder="e.g. 10:00 AM" required></div><div class="form-group full"><label>Description</label><textarea name="description" placeholder="Any specific requirements..."></textarea></div></div><button class="button button-coral form-submit" type="submit">Confirm booking</button></form></section></main><footer th:replace="~{fragments :: site-footer}"></footer><script th:src="@{/js/app.js}"></script></body></html>
