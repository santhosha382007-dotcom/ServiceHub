<!DOCTYPE html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments :: head}"><title>Sign in | ServiceHub</title></head><body><header th:replace="~{fragments :: site-header}"></header><main><section class="form-shell"><div class="form-heading"><p class="eyebrow">Welcome back</p><h1>Sign in to ServiceHub</h1><p>Keep your bookings and favourite services close.</p></div><p class="form-alert" th:if="${errorMessage}" th:text="${errorMessage}"></p><p class="form-success" th:if="${successMessage}" th:text="${successMessage}"></p><form th:action="@{/login}" th:object="${loginForm}" method="post"><div class="form-group"><label>Email address</label><input type="email" th:field="*{email}" required><small class="field-error" th:errors="*{email}"></small></div><div class="form-group" style="margin-top:17px"><label>Password</label><input type="password" th:field="*{password}" required><small class="field-error" th:errors="*{password}"></small></div><button class="button form-submit" type="submit">Sign in</button></form><p class="form-footer">New to ServiceHub? <a th:href="@{/register}">Create an account</a></p></section></main><footer th:replace="~{fragments :: site-footer}"></footer><script th:src="@{/js/app.js}"></script></body></html>
