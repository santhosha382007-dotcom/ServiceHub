<!DOCTYPE html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments :: head}"><title>Create account | ServiceHub</title></head><body><header th:replace="~{fragments :: site-header}"></header><main><section class="form-shell"><div class="form-heading"><p class="eyebrow">Start simply</p><h1>Create your account</h1><p>Save your details and make your next booking faster.</p></div><form th:action="@{/register}" th:object="${registration}" method="post"><div class="form-grid"><div class="form-group full"><label>Full name</label><input type="text" th:field="*{name}" required><small class="field-error" th:errors="*{name}"></small></div><div class="form-group"><label>Email address</label><input type="email" th:field="*{email}" required><small class="field-error" th:errors="*{email}"></small></div><div class="form-group"><label>Phone number</label><input type="tel" th:field="*{phone}" required><small class="field-error" th:errors="*{phone}"></small></div><div class="form-group"><label>Password</label><input type="password" th:field="*{password}" required><small class="field-error" th:errors="*{password}"></small></div><div class="form-group"><label>Confirm password</label><input type="password" th:field="*{confirmPassword}" required><small class="field-error" th:errors="*{confirmPassword}"></small></div></div><button class="button form-submit" type="submit">Create account</button></form><p class="form-footer">Already have an account? <a th:href="@{/login}">Sign in</a></p></section></main><footer th:replace="~{fragments :: site-footer}"></footer><script th:src="@{/js/app.js}"></script></body></html>
