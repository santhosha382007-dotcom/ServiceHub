spring.application.name=servicehub
spring.thymeleaf.cache=false
server.port=8082
spring.datasource.url=${DB_URL:jdbc:mysql://127.0.0.1:3306/servicehub_db?createDatabaseIfNotExist=true&serverTimezone=UTC&allowPublicKeyRetrieval=true&useSSL=false}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
servicehub.admin.name=${ADMIN_NAME:ServiceHub Admin}
servicehub.admin.email=${ADMIN_EMAIL:admin@servicehub.local}
servicehub.admin.phone=${ADMIN_PHONE:9999999999}
servicehub.admin.password=${ADMIN_PASSWORD:Admin@12345}
